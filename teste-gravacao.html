<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Firebase Iúna</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 32px 16px;
      background: #f6f1fb;
      color: #2f2440;
    }

    .card {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #75569f;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #resultado {
      margin-top: 20px;
      min-height: 120px;
      padding: 16px;
      border-radius: 12px;
      background: #f1edf6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      color: #146c43;
    }

    .erro {
      color: #b42318;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Teste direto do Firebase</h1>

    <p>
      Esta versão funciona sem módulos e pode ser aberta diretamente
      com duplo clique.
    </p>

    <button id="testar">
      Testar gravação no Firestore
    </button>

    <div id="resultado">Carregando Firebase...</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>

  <script>
    const resultado = document.getElementById("resultado");
    const botao = document.getElementById("testar");

    function escrever(texto, classe = "") {
      resultado.textContent = texto;
      resultado.className = classe;
    }

    window.addEventListener("error", function (event) {
      escrever(
        "ERRO DE JAVASCRIPT:\n\n" +
        (event.message || "Erro desconhecido"),
        "erro"
      );
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDwn2pB-P8Vb-Z-qPGrpu7p01NTmxpa7Xs",
      authDomain: "iuna-e113d.firebaseapp.com",
      projectId: "iuna-e113d",
      storageBucket: "iuna-e113d.firebasestorage.app",
      messagingSenderId: "611255762922",
      appId: "1:611255762922:web:be70b6fd48bff0c4db3c93"
    };

    let db = null;

    try {
      if (!window.firebase) {
        throw new Error(
          "A biblioteca do Firebase não carregou. Verifique a internet."
        );
      }

      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();

      escrever(
        "Firebase carregado com sucesso.\n" +
        "Projeto: iuna-e113d\n\n" +
        "Clique no botão para testar a gravação."
      );
    } catch (erro) {
      escrever(
        "ERRO AO INICIALIZAR:\n\n" +
        (erro.code || "") + "\n" +
        (erro.message || erro),
        "erro"
      );
    }

    botao.addEventListener("click", async function () {
      botao.disabled = true;
      botao.textContent = "Gravando...";

      escrever(
        "Tentando gravar no Firestore...\n\n" +
        "Projeto: iuna-e113d\n" +
        "Coleção: teste_conexao"
      );

      try {
        if (!db) {
          throw new Error("Firestore não foi inicializado.");
        }

        const referencia = await db
          .collection("teste_conexao")
          .add({
            mensagem: "Teste direto do site da Iúna",
            origem: "arquivo-sem-modulo",
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
            navegador: navigator.userAgent
          });

        escrever(
          "SUCESSO!\n\n" +
          "Documento criado no Firestore.\n" +
          "Coleção: teste_conexao\n" +
          "ID: " + referencia.id,
          "ok"
        );
      } catch (erro) {
        escrever(
          "ERRO AO GRAVAR:\n\n" +
          "Código: " + (erro.code || "sem código") + "\n" +
          "Mensagem: " + (erro.message || erro),
          "erro"
        );
      } finally {
        botao.disabled = false;
        botao.textContent = "Testar novamente";
      }
    });
  </script>
</body>
</html>
